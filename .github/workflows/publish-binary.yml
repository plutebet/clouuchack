name: publish-binary

# Copies the binary of an earlier build-cloudhack run into dist/ on the branch this
# workflow runs on, so it can be downloaded from GitHub directly. It does not
# rebuild anything: the artifact of that run is verified against the checksum
# file that the build wrote next to it, then committed as is.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-cloudhack run id to take the artifact from'
        default: '43488065114'
      artifact:
        description: 'artifact name'
        default: 'cloudhack-eeeww-arm64'
  push:
    paths:
      - '.github/workflows/publish-binary.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ inputs.run_id || '43488065114' }}
      ARTIFACT: ${{ inputs.artifact || 'cloudhack-eeeww-arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the artifact of the earlier run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: dl

      - name: Verify against the checksum file of that build
        run: |
          set -eu
          find dl -type f -exec ls -l {} +
          BIN="$(find dl -type f -name eeeww | head -n1)"
          SHAFILE="$(find dl -type f -name eeeww.sha256 | head -n1)"
          test -n "$BIN" && test -n "$SHAFILE"
          SUM="$(sha256sum "$BIN" | cut -d' ' -f1)"
          echo "binary sha256: $SUM"
          cat "$SHAFILE"
          grep -q "^$SUM " "$SHAFILE"
          file "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "SUM=$SUM" >> "$GITHUB_ENV"

      - name: Commit dist/
        run: |
          set -eu
          mkdir -p dist
          cp "$BIN" dist/eeeww
          chmod 755 dist/eeeww
          printf '%s  eeeww\n' "$SUM" > dist/eeeww.sha256
          printf 'artifact %s of build-cloudhack run %s\n' "$ARTIFACT" "$RUN_ID" > dist/SOURCE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ already holds this binary"
          else
            git commit -m "dist: eeeww from build-cloudhack run $RUN_ID (sha256 ${SUM:0:12})"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
